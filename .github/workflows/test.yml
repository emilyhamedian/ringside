name: Tests

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Pushes to main, release
# branches and tags each get a group of their own, since even without
# cancel-in-progress a group drops a queued run when another arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for a docs-only change
        id: classify
        run: python3 .github/scripts/ci_coverage.py

  test:
    needs: changes
    if: >-
      ${{ !cancelled() &&
        (github.event_name != 'pull_request' ||
         github.base_ref != github.event.repository.default_branch ||
         !github.event.pull_request.draft) &&
        needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Qt 6, the Plasma 6 QML modules and the check tools
        run: >-
          dnf -y -q install --setopt=install_weak_deps=False
          git diffutils qt6-qtdeclarative-devel libplasma kf6-kirigami kf6-ksvg
          kf6-kcmutils kf6-kitemmodels kf6-qqc2-desktop-style libksysguard
          ksystemstats plasma5support plasma-workspace plasma-breeze
          plasma-integration breeze-icon-theme google-noto-sans-fonts
          python3 ShellCheck reuse jq dbus-daemon

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Test the docs-only rule
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # D-Bus starts ksystemstats when the tests ask for it.
      - name: Run the check suite
        run: dbus-run-session -- sh scripts/test.sh

      - name: Render the gallery
        run: dbus-run-session -- sh scripts/gallery.sh ringside-gallery.png

      - name: Upload the gallery
        uses: actions/upload-artifact@v7
        with:
          name: ringside-gallery
          path: ringside-gallery.png

  floor:
    needs: changes
    if: >-
      ${{ !cancelled() &&
        (github.event_name != 'pull_request' ||
         github.base_ref != github.event.repository.default_branch ||
         !github.event.pull_request.draft) &&
        needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    # The supported floor, Plasma 6.0 with Qt 6.6 and KF 6.0, is Fedora 40
    # as released. Qt 6.6 reports binding loops that Qt 6.11 doesn't, so
    # only this job catches a regression of the fixes for them. Its libplasma
    # ships no importable org.kde.plasma.plasmoid module, so
    # scripts/test-floor.sh puts a stand-in from tests/floor on the import
    # path.
    container: fedora:40
    steps:
      # Fedora 40 is end of life and its release repository lives in the
      # archive on Fedora's download server. That repository alone is enabled,
      # so everything installed here is at its release version. Keep DNF's
      # diagnostics visible if downloading the archive fails.
      - name: Install Qt 6.6, the Plasma 6.0 QML modules and the test tools
        run: >-
          dnf -y install --setopt=install_weak_deps=False --repo=fedora
          --setopt=fedora.metalink=
          --setopt=fedora.baseurl=https://dl.fedoraproject.org/pub/archive/fedora/linux/releases/40/Everything/x86_64/os/
          diffutils qt6-qtdeclarative-devel libplasma kf6-kirigami kf6-ksvg
          kf6-kcmutils kf6-kitemmodels kf6-qqc2-desktop-style libksysguard
          ksystemstats plasma5support plasma-workspace plasma-breeze
          plasma-integration breeze-icon-theme google-noto-sans-fonts
          python3 jq dbus-daemon

      - name: Show the versions under test
        run: rpm -q qt6-qtdeclarative kf6-kirigami libplasma libksysguard python3

      - uses: actions/checkout@v7

      # D-Bus starts ksystemstats when the tests ask for it.
      - name: Run the tests and the gallery on Plasma 6.0
        run: dbus-run-session -- sh scripts/test-floor.sh

  # Marking a pull request ready for review is the owner's go-ahead
  # (CONTRIBUTING.md), so a ready one from a branch of this repository merges
  # as soon as its checks pass, and only the commit they tested. Drafts and
  # forks never merge here. Should GitHub still wait on something else, the
  # merge is left to auto-merge, for that commit. A merge made with this
  # run's token starts no run on main; this run has tested the merge already.
  merge:
    needs: [changes, test, floor]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'pull_request' &&
        github.base_ref == github.event.repository.default_branch &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.changes.result == 'success' &&
        contains(fromJSON('["success", "skipped"]'), needs.test.result) &&
        contains(fromJSON('["success", "skipped"]'), needs.floor.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$SHA" ||
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$SHA" --auto
