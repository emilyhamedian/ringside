name: Tests

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Pushes to main, release
# branches and tags each get a group of their own, since even without
# cancel-in-progress a group drops a queued run when another arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for a docs-only change
        id: classify
        run: python3 .github/scripts/ci_coverage.py

  test:
    needs: changes
    if: >-
      ${{ !cancelled() &&
        (github.event_name != 'pull_request' ||
         github.base_ref != github.event.repository.default_branch ||
         !github.event.pull_request.draft) &&
        needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    # KDE neon's user repository supplies the Plasma 6.8 baseline on Noble.
    # The base image is pinned; the repository floats, so reject a new Plasma
    # series rather than silently moving the supported baseline.
    container:
      image: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_CACHE_DIR: /var/cache/pip
      # Keep the headless controls style stable while loading Plasma font defaults.
      QT_QPA_PLATFORMTHEME: kde
      QT_QUICK_CONTROLS_STYLE: Fusion
    steps:
      - name: Prepare the package repositories
        id: repositories
        run: |
          set -eu
          # The base image otherwise deletes every downloaded .deb.
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl zstd
          install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location \
            https://invent.kde.org/neon/docker-images/-/raw/Neon/release/neon-archive-keyring.asc \
            -o /etc/apt/keyrings/neon-archive-keyring.asc
          chmod 0644 /etc/apt/keyrings/neon-archive-keyring.asc
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/neon-archive-keyring.asc] https://archive.neon.kde.org/user noble main' \
            > /etc/apt/sources.list.d/neon.list
          apt-get update
          sha256sum /var/lib/apt/lists/*InRelease > /tmp/ringside-repositories.sha256
          digest=$(sha256sum /tmp/ringside-repositories.sha256)
          printf 'cache-key=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"

      # Only cache downloads: apt must resolve and install from fresh indexes
      # on every run, including cache hits, so neon can't hide a new series.
      - name: Cache package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /var/cache/pip
          key: noble-downloads-v1-${{ runner.arch }}-${{ steps.repositories.outputs.cache-key }}
          restore-keys: noble-downloads-v1-${{ runner.arch }}-

      - name: Install Plasma 6.8 and the check tools
        run: |
          set -eu
          apt-get install -y --no-install-recommends \
            git diffutils qt6-declarative-dev-tools qml-qt6 qml6-module-qttest \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-localstorage qml6-module-org-kde-kirigami \
            qml6-module-org-kde-kcmutils qml6-module-org-kde-kitemmodels \
            qml6-module-org-kde-qqc2desktopstyle qml6-module-org-kde-ksysguard \
            libplasma6 ksystemstats plasma5support plasma-workspace breeze \
            plasma-integration breeze-icon-theme fonts-noto-core python3 python3-venv libmagic1t64 \
            shellcheck jq dbus-daemon
          # Noble's REUSE predates REUSE.toml support.
          python3 -m venv /opt/reuse
          /opt/reuse/bin/pip install 'reuse==6.2.0'
          ln -s /opt/reuse/bin/reuse /usr/local/bin/reuse
          # Do not carry obsolete package versions into the next cache.
          apt-get autoclean

      - name: Check the installed baseline
        run: |
          set -eu
          dpkg-query -W qt6-base kf6-kcoreaddons libplasma6 plasma-workspace \
            ksystemstats qml6-module-org-kde-ksysguard python3
          for package in libplasma6 plasma-workspace ksystemstats qml6-module-org-kde-ksysguard; do
            version=$(dpkg-query -W -f='${Version}' "$package")
            case ${version#*:} in
              6.8.*) ;;
              *) echo "$package $version is outside the Plasma 6.8 baseline" >&2; exit 1 ;;
            esac
          done

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Test the docs-only rule
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # D-Bus starts ksystemstats when the tests ask for it.
      - name: Run the check suite
        run: dbus-run-session -- sh scripts/test.sh

      - name: Render the gallery
        run: dbus-run-session -- sh scripts/gallery.sh ringside-gallery.png

      - name: Upload the gallery
        uses: actions/upload-artifact@v7
        with:
          name: ringside-gallery
          path: ringside-gallery.png
