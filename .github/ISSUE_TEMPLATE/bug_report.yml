name: Bug report
description: Something in Ringside isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Ringside version
      description: It's under Configure Ringside… → About.
      placeholder: e.g. 0.3.0
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: e.g. Fedora 42, Debian 13, Arch
    validations:
      required: true
  - type: input
    id: plasma
    attributes:
      label: Plasma version
      description: It's under System Settings → About This System.
    validations:
      required: true
  - type: input
    id: qt
    attributes:
      label: Qt version
    validations:
      required: true
  - type: textarea
    id: items
    attributes:
      label: Which items you show, in order
      placeholder: e.g. CPU, GPU, memory, network, Claude
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected instead, and how to make it happen again.
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Ringside's journal
      description: >-
        If a ring greys out or something stops working, paste what Ringside
        wrote to the journal around then:
        `journalctl --user --since today QT_CATEGORY=ringside.usage QT_CATEGORY=ringside.network QT_CATEGORY=ringside.gpu QT_CATEGORY=ringside.setup`
        It never includes tokens, addresses or account names, but it can
        include file paths, so give it a look first.
      render: text
    validations:
      required: false
  - type: textarea
    id: static-report
    attributes:
      label: What Ringside sees of your hardware
      description: >-
        For a CPU, GPU, memory, network or disk problem, paste what this
        prints:
        `sh ~/.local/share/plasma/plasmoids/dev.emily.ringside/contents/code/ringside-info.sh static | jq 'del(.root.uuid, .defaultInterface)'`
        The `jq` part drops the only two things in it that could identify
        you: your root filesystem's ID and your network interface's name,
        which can contain a USB adapter's MAC address. No `jq`? Delete the
        `uuid` and `defaultInterface` fields by hand. Installed for all users?
        The script is in `/usr/share/plasma/plasmoids/dev.emily.ringside/contents/code/`
        instead.
      render: json
    validations:
      required: false
